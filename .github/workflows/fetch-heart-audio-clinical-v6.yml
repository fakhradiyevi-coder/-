name: Fetch Heart Clinical Audio V6 EuropePMC

on:
  push:
    branches:
      - heart-simulator-control-v4-build
    paths:
      - '.github/workflows/fetch-heart-audio-clinical-v6.yml'
      - 'heart-audio-clinical-v6-trigger.txt'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Europe PMC supplementary files
        run: |
          set -euxo pipefail
          mkdir -p out
          for pmc in PMC6283745 PMC6761354 PMC10398423 PMC6281973 PMC9395133; do
            mkdir -p "out/$pmc"
            curl -L --fail --retry 3 "https://www.ebi.ac.uk/europepmc/webservices/rest/${pmc}/supplementaryFiles" -o "out/$pmc/supplementaryFiles.zip" || true
            if unzip -t "out/$pmc/supplementaryFiles.zip" >/dev/null 2>&1; then
              unzip -q "out/$pmc/supplementaryFiles.zip" -d "out/$pmc/extracted"
            fi
          done
          find out -type f -printf '%p\t%s bytes\n' | sort > out/FILE_LIST.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: heart-clinical-audio-v6
          path: out/
          retention-days: 7
