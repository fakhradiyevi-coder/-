name: Package Heart Sounds v1.1 PR

on:
  pull_request:
    branches: ["main"]
    paths:
      - "heart-sounds-v1.1/**"

permissions:
  contents: read

jobs:
  package-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare university logo
        run: |
          mkdir -p heart-sounds-v1.1/app/src/main/res/drawable
          curl -L --fail --retry 3 "https://kaznmu.edu.kz/wp-content/uploads/2024/03/cropped-logo-4.png" -o heart-sounds-v1.1/app/src/main/res/drawable/university_logo.png || true
          if [ ! -s heart-sounds-v1.1/app/src/main/res/drawable/university_logo.png ]; then
            python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          w, h = 640, 240
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  raw.extend((139,69,128,255) if 35 < x < 205 and 25 < y < 215 else (255,249,253,255))
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
          Path('heart-sounds-v1.1/app/src/main/res/drawable/university_logo.png').write_bytes(png)
          PY
          fi

      - name: Generate audio and build APK
        working-directory: heart-sounds-v1.1
        run: |
          python3 tools/generate_sounds.py | tee audio-validation.txt
          test "$(find app/src/main/res/raw -name '*.wav' | wc -l)" -eq 16
          gradle --no-daemon clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Asfendiyarov_Heart_Sounds_v1.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Asfendiyarov_Heart_Sounds_v1.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 Asfendiyarov_Heart_Sounds_v1.1.apk
          sha256sum Asfendiyarov_Heart_Sounds_v1.1.apk > Asfendiyarov_Heart_Sounds_v1.1.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asfendiyarov-Heart-Sounds-v1.1-Installer-Fast
          path: |
            heart-sounds-v1.1/Asfendiyarov_Heart_Sounds_v1.1.apk
            heart-sounds-v1.1/Asfendiyarov_Heart_Sounds_v1.1.sha256.txt
            heart-sounds-v1.1/audio-validation.txt
          if-no-files-found: error
          retention-days: 14
