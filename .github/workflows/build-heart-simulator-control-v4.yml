name: Build Heart Auscultation 4.1 APK

on:
  push:
    branches:
      - heart-simulator-control-v4-build

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify simplified UI source
        run: |
          set -euo pipefail
          MAIN="heart-simulator-direct/ANDROID_APP/app/src/main/java/kz/asfendiyarov/heartsimulator/MainActivity.java"
          test -s "$MAIN"
          grep -q "СЕЙЧАС ЗВУЧИТ" "$MAIN"
          grep -q "Выберите состояние" "$MAIN"
          grep -q "/api/play?track=" "$MAIN"
          ! grep -q "examMode" "$MAIN"
          ! grep -q "Режим: преподаватель" "$MAIN"
          ! grep -q "Режим: экзамен" "$MAIN"
          ! grep -q "diag_all" "$MAIN"
          ! grep -q "diag_one" "$MAIN"

      - name: Lint and build installable APK
        working-directory: heart-simulator-direct/ANDROID_APP
        run: |
          set -euo pipefail
          gradle --no-daemon clean lintDebug assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" Heart_Auscultation_Simple_4.1.0.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose Heart_Auscultation_Simple_4.1.0.apk
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 Heart_Auscultation_Simple_4.1.0.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging Heart_Auscultation_Simple_4.1.0.apk | tee apk-badging.txt
          grep -q "package: name='kz.asfendiyarov.heartsimulator'" apk-badging.txt
          grep -q "versionName='4.1.0'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          sha256sum Heart_Auscultation_Simple_4.1.0.apk > Heart_Auscultation_Simple_4.1.0.sha256.txt

      - name: Upload APK and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: Heart-Auscultation-Simple-4.1.0-APK
          path: |
            heart-simulator-direct/ANDROID_APP/Heart_Auscultation_Simple_4.1.0.apk
            heart-simulator-direct/ANDROID_APP/Heart_Auscultation_Simple_4.1.0.sha256.txt
            heart-simulator-direct/ANDROID_APP/apk-badging.txt
            heart-simulator-direct/ANDROID_APP/app/build/reports/lint-results-debug.html
            heart-simulator-direct/ANDROID_APP/app/build/reports/lint-results-debug.txt
          if-no-files-found: error
          retention-days: 14
