name: Package Heart Sounds v1.2 Live Recordings

on:
  pull_request:
    branches: ["main"]
    paths:
      - "heart-sounds-v1.2/**"
      - ".github/scripts/smoke-test-heart-sounds-v1-2.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare university logo
        run: |
          mkdir -p heart-sounds-v1.2/app/src/main/res/drawable
          curl -L --fail --retry 4 --retry-all-errors \
            "https://kaznmu.edu.kz/wp-content/uploads/2024/03/cropped-logo-4.png" \
            -o heart-sounds-v1.2/app/src/main/res/drawable/university_logo.png || true

          if [ ! -s heart-sounds-v1.2/app/src/main/res/drawable/university_logo.png ]; then
            python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          w, h = 640, 240
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  raw.extend((139,69,128,255) if 35 < x < 205 and 25 < y < 215 else (255,249,253,255))
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
          Path('heart-sounds-v1.2/app/src/main/res/drawable/university_logo.png').write_bytes(png)
          PY
          fi
          file heart-sounds-v1.2/app/src/main/res/drawable/university_logo.png

      - name: Download original live recordings
        shell: bash
        run: |
          set -euo pipefail
          RAW="heart-sounds-v1.2/app/src/main/res/raw"
          mkdir -p "$RAW"
          REFERER="https://teachingheartauscultation.com/heart-sounds-mp3-downloads"
          AGENT="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/151 Safari/537.36"

          download_mp3() {
            local id="$1"
            local name="$2"
            local url="https://teachingheartauscultation.com/download/${id}/?tmstv=$(date +%s%N)"
            echo "Downloading $name from item $id"
            curl -L --fail --show-error --retry 5 --retry-all-errors \
              --connect-timeout 30 --max-time 240 \
              -A "$AGENT" -e "$REFERER" \
              "$url" -o "$RAW/${name}.mp3"
            test -s "$RAW/${name}.mp3"
          }

          download_mp3 1716 adult_case_1_normal
          download_mp3 1719 adult_case_2_innocent
          download_mp3 1721 adult_case_3_mitral_stenosis
          download_mp3 1723 adult_case_3a_mitral_stenosis
          download_mp3 1726 adult_case_3b_mitral_stenosis
          download_mp3 1728 adult_case_3c_mitral_stenosis
          download_mp3 1731 adult_case_3d_mitral_stenosis
          download_mp3 1734 adult_case_4_bicuspid_aortic_stenosis_insufficiency
          download_mp3 1738 adult_case_4a_bicuspid_aortic_stenosis_insufficiency
          download_mp3 1743 adult_case_4b_bicuspid_aortic_stenosis_insufficiency
          download_mp3 1748 adult_case_4c_bicuspid_aortic_stenosis_insufficiency
          download_mp3 1751 adult_case_5_vsd
          download_mp3 1754 adult_case_6_mitral_insufficiency_mvp
          download_mp3 1756 adult_case_6a_mitral_insufficiency_mvp
          download_mp3 1759 adult_case_7_pda

          download_mp3 1109 child_case_1_asd
          download_mp3 1110 child_case_2_pulmonary_stenosis
          download_mp3 1111 child_case_3_pda
          download_mp3 1112 child_case_4_aortic_stenosis_regurgitation
          download_mp3 1113 child_case_5_normal
          download_mp3 1114 child_case_6_bicuspid_aortic_valve
          download_mp3 1115 child_case_7_asd
          download_mp3 1116 child_case_8_innocent_s3
          download_mp3 1117 child_case_9_vsd

          test "$(find "$RAW" -maxdepth 1 -name '*.mp3' | wc -l)" -eq 24
          find "$RAW" -maxdepth 1 -name '*.mp3' -print0 | sort -z | xargs -0 sha256sum > heart-sounds-v1.2/original-recordings.sha256.txt

      - name: Validate every recording
        shell: bash
        run: |
          set -euo pipefail
          RAW="heart-sounds-v1.2/app/src/main/res/raw"
          REPORT="heart-sounds-v1.2/audio-validation.csv"
          echo "file,size_bytes,duration_seconds,max_volume_db,sha256" > "$REPORT"

          for audio in "$RAW"/*.mp3; do
            ffmpeg -v error -i "$audio" -f null -
            duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$audio")
            python3 - "$audio" "$duration" <<'PY'
          import os, sys
          path, duration = sys.argv[1], float(sys.argv[2])
          if os.path.getsize(path) < 10000:
              raise SystemExit(f"Audio file too small: {path}")
          if duration < 2.0:
              raise SystemExit(f"Audio file too short: {path} ({duration})")
          PY
            ffmpeg -hide_banner -i "$audio" -af volumedetect -f null - 2> /tmp/volume.log
            max_volume=$(grep -oE 'max_volume: [-0-9.]+ dB' /tmp/volume.log | tail -1 | awk '{print $2}')
            test -n "$max_volume"
            test "$max_volume" != "-inf"
            size=$(stat -c%s "$audio")
            hash=$(sha256sum "$audio" | awk '{print $1}')
            printf '%s,%s,%.3f,%s,%s\n' "$(basename "$audio")" "$size" "$duration" "$max_volume" "$hash" >> "$REPORT"
          done

          test "$(($(wc -l < "$REPORT") - 1))" -eq 24
          cat "$REPORT"

      - name: Generate output test signal
        run: |
          python3 - <<'PY'
          import math, struct, wave
          from pathlib import Path
          sr = 44100
          duration = 5.2
          windows = [(0.35,1.05,660.0),(1.35,2.05,880.0),(2.35,3.05,660.0),(3.35,4.35,880.0)]
          pcm=[]
          for i in range(int(sr*duration)):
              t=i/sr
              y=0.0
              for start,end,freq in windows:
                  if start <= t <= end:
                      x=(t-start)/(end-start)
                      env=max(0.0,min(1.0,x/0.05,(1.0-x)/0.05))
                      y=0.72*env*(0.78*math.sin(2*math.pi*freq*t)+0.22*math.sin(2*math.pi*freq*1.5*t))
                      break
              pcm.append(int(max(-1,min(1,y))*32767))
          path=Path('heart-sounds-v1.2/app/src/main/res/raw/test_output.wav')
          with wave.open(str(path),'wb') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
              f.writeframes(struct.pack('<'+'h'*len(pcm),*pcm))
          PY
          ffmpeg -v error -i heart-sounds-v1.2/app/src/main/res/raw/test_output.wav -f null -

      - name: Build APK
        working-directory: heart-sounds-v1.2
        run: |
          gradle --no-daemon clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Asfendiyarov_Heart_Sounds_v1.2.apk

      - name: Validate APK package
        working-directory: heart-sounds-v1.2
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Asfendiyarov_Heart_Sounds_v1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 Asfendiyarov_Heart_Sounds_v1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Asfendiyarov_Heart_Sounds_v1.2.apk | tee apk-badging.txt
          grep -q "versionName='1.2.0'" apk-badging.txt
          unzip -l Asfendiyarov_Heart_Sounds_v1.2.apk | grep -c 'res/raw/.*\.mp3' | grep -q '^24$'
          sha256sum Asfendiyarov_Heart_Sounds_v1.2.apk > Asfendiyarov_Heart_Sounds_v1.2.sha256.txt

      - name: Run Android 15 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/smoke-test-heart-sounds-v1-2.sh heart-sounds-v1.2/Asfendiyarov_Heart_Sounds_v1.2.apk

      - name: Upload tested installer
        uses: actions/upload-artifact@v4
        with:
          name: Asfendiyarov-Heart-Sounds-v1.2-Live-Recordings-Installer
          path: |
            heart-sounds-v1.2/Asfendiyarov_Heart_Sounds_v1.2.apk
            heart-sounds-v1.2/Asfendiyarov_Heart_Sounds_v1.2.sha256.txt
            heart-sounds-v1.2/audio-validation.csv
            heart-sounds-v1.2/original-recordings.sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Asfendiyarov-Heart-Sounds-v1.2-Test-Evidence
          path: |
            heart-sounds-v1.2/test-evidence
            heart-sounds-v1.2/audio-validation.csv
            heart-sounds-v1.2/apk-badging.txt
          if-no-files-found: warn
          retention-days: 14
