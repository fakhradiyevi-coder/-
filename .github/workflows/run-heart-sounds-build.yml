name: Produce Heart Sounds Installer

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/run-heart-sounds-build.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Load build recipe from project branch
        run: |
          git fetch origin ahs-apk-build:refs/remotes/origin/ahs-apk-build
          git show origin/ahs-apk-build:.github/workflows/build-heart-sounds-apk.yml > /tmp/heart-build.yml
          python3 -m pip install --quiet pyyaml

      - name: Execute project build steps
        run: |
          cat > /tmp/run_recipe.py <<'PY'
          import os, subprocess, yaml
          with open('/tmp/heart-build.yml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          steps = data['jobs']['build-apk']['steps']
          for index, step in enumerate(steps, 1):
              script = step.get('run')
              if not script:
                  continue
              name = step.get('name', f'step-{index}')
              workdir = step.get('working-directory', '.')
              print(f'\n===== {name} =====', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], cwd=workdir, check=True, env=os.environ.copy())
          PY
          python3 /tmp/run_recipe.py

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Asfendiyarov-Heart-Sounds-Installer
          path: Asfendiyarov_Heart_Sounds_v1.0.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish installer as text payload
        if: github.event_name == 'push'
        run: |
          mkdir -p generated
          base64 -w0 Asfendiyarov_Heart_Sounds_v1.0.apk > generated/Asfendiyarov_Heart_Sounds_v1.0.apk.b64
          sha256sum Asfendiyarov_Heart_Sounds_v1.0.apk > generated/Asfendiyarov_Heart_Sounds_v1.0.sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/Asfendiyarov_Heart_Sounds_v1.0.apk.b64 generated/Asfendiyarov_Heart_Sounds_v1.0.sha256.txt
          git commit -m "Add generated Asfendiyarov Heart Sounds APK" || true
          git push origin main
