name: Test Heart Sounds v1.1 PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "heart-sounds-v1.1/**"
      - ".github/scripts/smoke-test-heart-sounds-v1-1.sh"
      - ".github/workflows/build-heart-sounds-v1-1.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare university logo
        run: |
          mkdir -p heart-sounds-v1.1/app/src/main/res/drawable
          curl -L --fail --retry 3 \
            "https://kaznmu.edu.kz/wp-content/uploads/2024/03/cropped-logo-4.png" \
            -o heart-sounds-v1.1/app/src/main/res/drawable/university_logo.png || true

          if [ ! -s heart-sounds-v1.1/app/src/main/res/drawable/university_logo.png ]; then
            python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          width, height = 640, 240
          raw = bytearray()
          for y in range(height):
              raw.append(0)
              for x in range(width):
                  inside = 35 < x < 205 and 25 < y < 215
                  raw.extend((139, 69, 128, 255) if inside else (255, 249, 253, 255))

          def chunk(chunk_type, data):
              return struct.pack('>I', len(data)) + chunk_type + data + struct.pack('>I', zlib.crc32(chunk_type + data) & 0xFFFFFFFF)

          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
          Path('heart-sounds-v1.1/app/src/main/res/drawable/university_logo.png').write_bytes(png)
          PY
          fi

      - name: Generate and validate audio files
        working-directory: heart-sounds-v1.1
        run: |
          python3 tools/generate_sounds.py | tee audio-validation.txt
          test "$(find app/src/main/res/raw -name '*.wav' | wc -l)" -eq 16
          grep -q "test_output" audio-validation.txt

      - name: Build APK
        working-directory: heart-sounds-v1.1
        run: |
          gradle --no-daemon clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Asfendiyarov_Heart_Sounds_v1.1.apk

      - name: Validate installer
        working-directory: heart-sounds-v1.1
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Asfendiyarov_Heart_Sounds_v1.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 Asfendiyarov_Heart_Sounds_v1.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Asfendiyarov_Heart_Sounds_v1.1.apk | tee apk-badging.txt
          grep -q "versionName='1.1.0'" apk-badging.txt
          sha256sum Asfendiyarov_Heart_Sounds_v1.1.apk > Asfendiyarov_Heart_Sounds_v1.1.sha256.txt

      - name: Run Android 15 playback smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/smoke-test-heart-sounds-v1-1.sh heart-sounds-v1.1/Asfendiyarov_Heart_Sounds_v1.1.apk

      - name: Upload tested APK installer
        uses: actions/upload-artifact@v4
        with:
          name: Asfendiyarov-Heart-Sounds-v1.1-Installer
          path: |
            heart-sounds-v1.1/Asfendiyarov_Heart_Sounds_v1.1.apk
            heart-sounds-v1.1/Asfendiyarov_Heart_Sounds_v1.1.sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Asfendiyarov-Heart-Sounds-v1.1-Test-Evidence
          path: |
            heart-sounds-v1.1/test-evidence
            heart-sounds-v1.1/audio-validation.txt
            heart-sounds-v1.1/apk-badging.txt
          if-no-files-found: warn
          retention-days: 14
