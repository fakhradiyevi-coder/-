name: Fetch Heart Clinical Audio V5

on:
  push:
    branches:
      - heart-simulator-control-v4-build
    paths:
      - '.github/workflows/fetch-heart-audio-clinical-v5.yml'
      - 'heart-audio-clinical-v5-trigger.txt'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PMC supplementary heart sound media
        run: |
          set -euxo pipefail
          mkdir -p out
          python3 - <<'PY'
          import pathlib, re, urllib.request, urllib.parse
          pmcs={
            'HOCM':'PMC6283745',
            'S3':'PMC6761354',
            'PERICARDIAL':'PMC10398423',
            'HCM_AVB_S4':'PMC6281973',
            'COMPLETE_AVB_S4':'PMC9395133',
          }
          ua={'User-Agent':'Mozilla/5.0'}
          for label,pmc in pmcs.items():
              d=pathlib.Path('out')/label; d.mkdir(parents=True, exist_ok=True)
              url=f'https://pmc.ncbi.nlm.nih.gov/articles/{pmc}/'
              try:
                  req=urllib.request.Request(url,headers=ua)
                  html=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','ignore')
                  (d/'article.html').write_text(html)
                  links=[]
                  for href in re.findall(r'href=["\']([^"\']+)["\']',html,re.I):
                      low=href.lower()
                      if '/bin/' in low or any(low.endswith(x) for x in ('.mp3','.wav','.avi','.mp4','.zip','.mov','.m4a')):
                          u=urllib.parse.urljoin(url,href)
                          if u not in links: links.append(u)
                  (d/'media_links.txt').write_text('\n'.join(links))
                  for i,u in enumerate(links,1):
                      name=urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit('/',1)[-1]) or f'media_{i}'
                      name=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                      target=d/f'{i:02d}_{name}'
                      try:
                          req2=urllib.request.Request(u,headers=ua)
                          target.write_bytes(urllib.request.urlopen(req2,timeout=90).read())
                      except Exception as e:
                          (d/f'{i:02d}_DOWNLOAD_ERROR.txt').write_text(u+'\n'+repr(e))
              except Exception as e:
                  (d/'ARTICLE_ERROR.txt').write_text(repr(e))
          PY
          find out -type f -printf '%p\t%s bytes\n' | sort > out/FILE_LIST.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: heart-clinical-audio-v5
          path: out/
          retention-days: 7
